<body class="bg-surface min-h-screen flex flex-col items-center justify-between text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<div class="w-full max-w-md flex-1 flex flex-col px-margin-mobile md:px-margin-tablet pt-12 pb-8">
<!-- Back Action -->
<button aria-label="Volver" class="mb-stack-lg w-12 h-12 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<!-- Header -->
<div class="mb-stack-lg">
<h1 class="text-headline-md font-headline-md text-on-surface">Crea tu cuenta</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-baseline">Únete a Sancarlina y descubre una nueva experiencia.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md w-full flex-1">
<!-- Input: Nombre -->
<div class="flex flex-col">
<label class="text-label-lg font-label-lg text-on-surface mb-baseline px-4" for="nombre">Nombre</label>
<input class="w-full bg-surface-container text-body-lg font-body-lg text-on-surface placeholder:text-on-surface-variant/50 rounded-t-lg border-0 border-b-2 border-primary focus:ring-0 focus:border-b-4 focus:bg-surface-container-high transition-all py-4 px-4" id="nombre" name="nombre" placeholder="Juan Pérez" required="" type="text"/>
</div>
<!-- Input: Email -->
<div class="flex flex-col">
<label class="text-label-lg font-label-lg text-on-surface mb-baseline px-4" for="email">Email</label>
<input class="w-full bg-surface-container text-body-lg font-body-lg text-on-surface placeholder:text-on-surface-variant/50 rounded-t-lg border-0 border-b-2 border-primary focus:ring-0 focus:border-b-4 focus:bg-surface-container-high transition-all py-4 px-4" id="email" name="email" placeholder="hola@ejemplo.com" required="" type="email"/>
</div>
<!-- Input: Teléfono -->
<div class="flex flex-col">
<label class="text-label-lg font-label-lg text-on-surface mb-baseline px-4" for="telefono">Teléfono</label>
<input class="w-full bg-surface-container text-body-lg font-body-lg text-on-surface placeholder:text-on-surface-variant/50 rounded-t-lg border-0 border-b-2 border-primary focus:ring-0 focus:border-b-4 focus:bg-surface-container-high transition-all py-4 px-4" id="telefono" name="telefono" placeholder="+54 9 11 1234 5678" required="" type="tel"/>
</div>
<!-- Spacer -->
<div class="flex-1"></div>
<!-- Submit Button -->
<button class="w-full bg-secondary text-on-secondary text-label-lg font-label-lg py-4 rounded-full mt-stack-lg shadow-sm hover:shadow-md hover:bg-secondary/90 transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                Registrarse
            </button>
<p class="text-center text-body-md font-body-md text-on-surface-variant mt-stack-sm">
                ¿Ya tienes una cuenta? <a class="text-primary font-bold hover:underline" href="#">Inicia sesión</a>
</p>
</form>
</div>
<!-- Decorative Isologo -->
