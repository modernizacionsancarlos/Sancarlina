<style>
        .check-anim {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw 0.8s ease-out forwards;
        }
        
        .circle-anim {
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: draw-circle 0.6s ease-out forwards;
        }

        .icon-container {
            animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fade-up 0.6s ease-out 0.4s forwards;
        }

        .fade-up-delayed {
            opacity: 0;
            transform: translateY(20px);
            animation: fade-up 0.6s ease-out 0.6s forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        
        @keyframes draw-circle {
            to { stroke-dashoffset: 0; }
        }

        @keyframes pop-in {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fade-up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-tablet">

<circle class="circle-anim" cx="50" cy="50" r="45" stroke="currentColor" stroke-linecap="round" stroke-width="6"></circle>
<path class="check-anim" d="M30 50L45 65L70 35" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"></path>
</svg>
</div>
<!-- Isologo Placeholder -->

<div class="fade-up flex flex-col space-y-stack-sm">
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-primary-container">
                ¡Trámite realizado con éxito!
            </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-sm mx-auto">
                Tu solicitud ha sido procesada correctamente y se encuentra registrada en el sistema.
            </p>
</div>
<!-- Action Button -->
<div class="fade-up-delayed w-full mt-stack-lg pt-stack-md">
<button class="w-full h-14 bg-secondary text-on-secondary rounded-[24px] text-label-lg font-label-lg shadow-sm hover:shadow-md transition-all active:scale-95 flex items-center justify-center space-x-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">home</span>
<span>Volver al Inicio</span>
</button>

<div class="absolute bottom-[-10%] right-[-10%] w-1/2 h-1/2 bg-secondary/5 rounded-full blur-[100px]"></div>
