<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configuración de Notificaciones</title>
<!-- Google Fonts: Work Sans -->

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        theme: {

                    "on-surface": "#1a1d13",
                    "secondary": "#9f3d4c",
                    "tertiary-fixed": "#e2e3e0",
                    "secondary-container": "#ff8795",
                    "primary-fixed": "#d8eb98",

                    "surface-tint": "#556421",

                    "error-container": "#ffdad6",

                    "error": "#ba1a1a",

            "borderRadius": {

                    "stack-lg": "24px",
                    "gutter": "16px",
                    "container-padding": "20px"
            },
            "fontFamily": {
                    "label-md": ["Work Sans"],
                    "headline-lg": ["Work Sans"],
                    "label-sm": ["Work Sans"],
                    "headline-md": ["Work Sans"],

                    "body-md": ["Work Sans"],

                    "headline-lg-mobile": ["Work Sans"]
            },
            "fontSize": {

                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

          }
        }
      }

<style>
        /* Base styles to ensure consistency */
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom Toggle Switch Styles leveraging Tailwind Peer */
        .toggle-checkbox:checked + .toggle-label {
            @apply bg-primary;
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            @apply border-white;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface h-screen w-full flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Header (Transactional Sub-page Header, replacing global shell) -->
<header class="w-full h-16 bg-primary text-on-primary flex items-center px-container-padding shrink-0 shadow-sm z-10 sticky top-0">
<button aria-label="Volver" class="h-10 w-10 flex items-center justify-center rounded-full hover:bg-white/10 active:bg-white/20 transition-colors mr-2 -ml-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm tracking-tight truncate flex-1">AJUSTES DE ALERTAS</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-container-padding py-stack-lg w-full max-w-md mx-auto">
<!-- White Rounded Card for Options -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(83,98,33,0.04)] border border-surface-container-low overflow-hidden">
<!-- Option 1: Nuevas Ofertas y Descuentos (Active) -->
<div class="flex items-center justify-between p-4 border-b border-surface-container-high transition-colors hover:bg-surface-bright">
<span class="font-label-md text-label-md text-on-surface flex-1 pr-4">Nuevas Ofertas y Descuentos</span>
<div class="relative inline-block w-12 h-6 align-middle select-none shrink-0">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0 peer" id="toggle1" name="toggle1" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200 ease-in-out relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-transform after:duration-200 after:shadow-sm" for="toggle1"></label>
</div>
</div>
<!-- Option 2: Acreditación de Puntos (Active) -->
<div class="flex items-center justify-between p-4 border-b border-surface-container-high transition-colors hover:bg-surface-bright">
<span class="font-label-md text-label-md text-on-surface flex-1 pr-4">Acreditación de Puntos</span>
<div class="relative inline-block w-12 h-6 align-middle select-none shrink-0">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0 peer" id="toggle2" name="toggle2" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200 ease-in-out relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-transform after:duration-200 after:shadow-sm" for="toggle2"></label>
</div>
</div>
<!-- Option 3: Mensajes de Productores (Active) -->
<div class="flex items-center justify-between p-4 border-b border-surface-container-high transition-colors hover:bg-surface-bright">
<span class="font-label-md text-label-md text-on-surface flex-1 pr-4">Mensajes de Productores</span>
<div class="relative inline-block w-12 h-6 align-middle select-none shrink-0">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0 peer" id="toggle3" name="toggle3" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200 ease-in-out relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-transform after:duration-200 after:shadow-sm" for="toggle3"></label>
</div>
</div>
<!-- Option 4: Eventos y Ferias Municipales (Inactive) -->
<div class="flex items-center justify-between p-4 transition-colors hover:bg-surface-bright">
<span class="font-label-md text-label-md text-on-surface flex-1 pr-4">Eventos y Ferias Municipales</span>
<div class="relative inline-block w-12 h-6 align-middle select-none shrink-0">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0 peer" id="toggle4" name="toggle4" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200 ease-in-out relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-transform after:duration-200 after:shadow-sm" for="toggle4"></label>
</div>
</div>
</div>
<!-- Footer Action Container -->
<div class="mt-stack-lg flex justify-center w-full pb-8">
<button class="font-label-md text-label-md text-secondary h-12 px-6 rounded-full hover:bg-surface-container-low active:bg-surface-container transition-colors focus:outline-none focus:ring-2 focus:ring-secondary/50">
                Restablecer valores iniciales
            </button>
</div>
</main>
</body></html>
