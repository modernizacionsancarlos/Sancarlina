<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sancarlina - Sumá tu Emprendimiento</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {

                        "on-tertiary-fixed": "#1a1c1b",
                        "error": "#ba1a1a",
                        "tertiary-container": "#737573",
                        "surface-container-highest": "#e2e4d3",
                        "surface": "#f9fbea",
                        "outline-variant": "#c6c8b7",
                        "primary-container": "#6b7b36",
                        "secondary-fixed-dim": "#ffb2b9",
                        "tertiary": "#5b5c5a",
                        "surface-bright": "#f9fbea",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#53621f",
                        "outline": "#76786a",
                        "surface-variant": "#e2e4d3",
                        "on-background": "#1a1d13",
                        "tertiary-fixed-dim": "#c6c7c4",
                        "surface-container": "#edefdf",
                        "surface-container-low": "#f3f5e4",
                        "on-primary-container": "#fbffe3",
                        "tertiary-fixed": "#e2e3e0",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#171e00",
                        "background": "#f9fbea",
                        "primary-fixed": "#d8eb98",
                        "on-surface-variant": "#46483b",
                        "secondary-fixed": "#ffdadb",
                        "inverse-surface": "#2f3227",
                        "inverse-on-surface": "#f0f2e1",
                        "primary-fixed-dim": "#bccf7f",
                        "on-secondary-fixed": "#40000f",
                        "on-tertiary-container": "#fdfdfa",
                        "on-secondary-fixed-variant": "#802635",
                        "surface-tint": "#556421",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#bccf7f",
                        "on-primary-fixed-variant": "#3e4c0a",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "base": "8px",
                        "stack-lg": "24px",
                        "container-padding": "20px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Work Sans"],
                        "label-md": ["Work Sans"],

                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                }
            }
        }

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 12px rgba(112, 25, 42, 0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-background pb-20">
<!-- TopAppBar Component -->
<header class="bg-primary dark:bg-primary-container docked full-width top-0 rounded-b-none flex flex-col items-center pt-8 pb-4 px-container-padding w-full sticky z-50">
<div class="flex items-center justify-between w-full">
<button class="text-on-primary dark:text-on-primary-container p-2 hover:bg-primary-fixed-dim/20 transition-colors rounded-full">
<span class="material-symbols-outlined text-2xl" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile font-bold text-on-primary dark:text-on-primary-container uppercase tracking-wider">SANCARLINA</h1>
<button class="text-on-primary dark:text-on-primary-container p-2 hover:bg-primary-fixed-dim/20 transition-colors rounded-full">
<span class="material-symbols-outlined text-2xl" data-icon="search">search</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="px-container-padding py-stack-lg max-w-2xl mx-auto space-y-stack-lg">
<!-- Page Header -->
<div class="text-center space-y-stack-sm mb-8">
<h2 class="text-headline-md font-headline-md text-primary">REGISTRÁ TU COMERCIO</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Formá parte de Sancarlina. Completá los datos de tu proyecto para sumarte al mapa y catálogo local.</p>
</div>
<!-- Form Formulario -->
<form class="space-y-stack-md" onsubmit="event.preventDefault(); alert('Solicitud enviada');">
<!-- Bento-style Form Grid -->
<div class="glass-card rounded-xl p-6 space-y-stack-md">
<!-- Input: Nombre -->
<div>
<label class="text-label-md font-label-md text-on-surface-variant block mb-2" for="nombre">Nombre del Emprendimiento</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="nombre" name="nombre" placeholder="Ej. Panadería La Unión" required="" type="text"/>
</div>
<!-- Input: Categoría -->
<div>
<label class="text-label-md font-label-md text-on-surface-variant block mb-2" for="categoria">Categoría</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-md appearance-none focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="categoria" name="categoria" required="">
<option disabled="" selected="" value="">Seleccioná una categoría</option>
<option value="gastronomia">Gastronomía</option>
<option value="artesanias">Artesanías</option>
<option value="servicios">Servicios</option>
<option value="indumentaria">Indumentaria</option>
<option value="otro">Otro</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-3.5 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Input: Teléfono -->
<div>
<label class="text-label-md font-label-md text-on-surface-variant block mb-2" for="telefono">Teléfono</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="telefono" name="telefono" placeholder="+54 9..." required="" type="tel"/>
</div>
<!-- Input: Ubicación -->
<div>
<label class="text-label-md font-label-md text-on-surface-variant block mb-2" for="ubicacion">Ubicación</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="ubicacion" name="ubicacion" placeholder="Dirección completa" required="" type="text"/>
</div>
</div>
<!-- File Upload Zone -->
<div class="glass-card rounded-xl p-6">
<label class="text-label-md font-label-md text-on-surface-variant block mb-2">Imágenes</label>
<div class="border-2 border-dashed border-outline-variant rounded-lg p-8 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined text-4xl text-primary mb-3 group-hover:scale-110 transition-transform">add_photo_alternate</span>
<p class="text-body-md font-body-md text-on-surface">Subir Logo o Foto de Portada</p>
<p class="text-label-sm font-label-sm text-outline mt-1">JPG, PNG. Máx 5MB.</p>
<input accept="image/*" class="hidden" id="fileUpload" type="file"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-secondary text-on-secondary rounded-lg py-4 text-label-md font-label-md uppercase tracking-wider font-bold shadow-md hover:bg-on-secondary-container transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary min-h-[48px] active:scale-[0.98]" type="submit">
                    ENVIAR SOLICITUD DE ALTA
                </button>
</div>
</form>
</main>
<!-- BottomNavBar Component (Hidden on desktop, shown on mobile) -->
<!-- Suppressed on transactional/form page as per instructions -->
<script>
        // Simple file upload interaction
        const fileUploadZone = document.querySelector('.border-dashed');
        const fileInput = document.getElementById('fileUpload');

        fileUploadZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                const fileName = e.target.files[0].name;
                const textElement = fileUploadZone.querySelector('.text-body-md');
                textElement.textContent = fileName;
                textElement.classList.add('text-secondary', 'font-bold');
            }
        });
    </script>
</body></html>
