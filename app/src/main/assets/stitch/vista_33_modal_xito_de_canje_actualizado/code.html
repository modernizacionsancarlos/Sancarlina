<!-- Success Modal Overlay -->

<!-- Modal Card -->
<div class="bg-surface-container-lowest rounded-[24px] w-full max-w-[400px] p-[30px] modal-shadow transform transition-all duration-500 scale-100 flex flex-col items-center text-center animate-in fade-in zoom-in duration-300">
<!-- Success Icon Animation -->
<div class="w-20 h-20 bg-[#7E8F47] rounded-full flex items-center justify-center mb-stack-lg shadow-lg">
<span class="material-symbols-outlined text-white text-[48px]" style="font-variation-settings: 'FILL' 0, 'wght' 700;">check</span>
</div>

<h2 class="font-headline-md text-headline-md text-[#7E8F47] mb-stack-md tracking-tight">¡CANJE EXITOSO!</h2>

            </p>

<button class="w-full h-12 bg-[#7E8F47] text-white font-label-md text-label-md rounded-full shadow-md active:scale-95 transition-transform duration-150 uppercase tracking-wider font-bold" onclick="closeModal()">
                ENTENDIDO
            </button>

<div class="mt-stack-lg flex gap-2">
<div class="w-2 h-2 rounded-full bg-primary-fixed"></div>

<div class="w-2 h-2 rounded-full bg-primary-fixed"></div>
</div>

<!-- Micro-interactions Script -->
<script>
        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            
            // Optional: Redirect or reset view
            setTimeout(() => {
                // For demo purposes, we just hide it
                overlay.classList.add('hidden');
            }, 300);
        }

        // Entrance effect on load
        window.addEventListener('DOMContentLoaded', () => {
            const modalContent = document.querySelector('#modal-overlay > div');
            modalContent.classList.add('scale-100', 'opacity-100');
        });
    </script>
<!-- Shell Suppression Logic: Navigation is suppressed as this is a success/confirmation view -->
