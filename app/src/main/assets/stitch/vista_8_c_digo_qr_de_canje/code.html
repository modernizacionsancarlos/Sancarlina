<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface antialiased">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim text-primary dark:text-primary-fixed w-full top-0 sticky flex items-center justify-between px-container-padding h-16 shadow-sm z-40">
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-secondary dark:text-secondary-fixed">SANCARLINA</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-container-padding">
<!-- Glassmorphism/Bento Style Card -->
<div class="bg-surface-container-lowest rounded-[16px] shadow-[0_4px_12px_rgba(83,98,31,0.04)] w-full max-w-md p-stack-lg flex flex-col items-center text-center border border-surface-variant relative overflow-hidden">
<!-- Subtle background accent -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container opacity-10 rounded-bl-full -z-10"></div>
<div class="space-y-stack-sm mb-stack-lg">
<h2 class="font-headline-sm text-headline-sm text-on-surface">CÓDIGO DE CANJE</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Mostrá este código en la caja para aplicar tu beneficio.</p>
</div>
<!-- QR Code Area -->
<div class="bg-surface-container-lowest border-4 border-primary p-4 rounded-xl mb-stack-lg shadow-sm">
<!-- Placeholder for QR Image -->
<div class="w-48 h-48 bg-surface-container-high flex items-center justify-center rounded-lg" data-alt="A clean, crisp black and white QR code generated for a mobile interface, set against a pristine white background. The QR code is perfectly square, sharp, and easy to scan, typical of modern digital redemption screens. The surrounding UI style is warm and earthy, but the code itself remains purely functional and high-contrast for readability.">
<span class="material-symbols-outlined text-outline-variant text-6xl">qr_code_2</span>
</div>
</div>
<!-- Details -->
<div class="bg-surface-container-low w-full p-stack-md rounded-lg mb-stack-lg space-y-base text-left border border-surface-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-md text-label-md text-on-surface">15% de Descuento - Bodega La Celia</span>
</div>
</div>
<!-- Timer -->
<div class="flex items-center justify-center gap-2 mb-stack-lg bg-secondary-container/20 text-on-secondary-container px-4 py-2 rounded-full border border-secondary-container/30">
<span class="material-symbols-outlined text-secondary" data-icon="schedule" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-label-md text-label-md font-bold" id="countdown">Vence en 09:59 minutos</span>
</div>
<!-- Action -->
<button class="w-full min-h-[48px] font-label-md text-label-md bg-transparent border-2 border-secondary text-secondary rounded-lg hover:bg-secondary/5 active:scale-95 transition-all flex items-center justify-center gap-2">
<span>VOLVER A MIS PUNTOS</span>
</button>
</div>
</main>
<script>
        // Simple countdown logic for visual effect
        let time = 599; // 9:59 in seconds
        const countdownEl = document.getElementById('countdown');
        
        setInterval(() => {
            if (time <= 0) return;
            time--;
            let minutes = Math.floor(time / 60);
            let seconds = time % 60;
            countdownEl.innerText = `Vence en 0${minutes}:${seconds < 10 ? '0' : ''}${seconds} minutos`;
        }, 1000);
    </script>
