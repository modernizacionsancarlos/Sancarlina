<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sancarlina - Registro</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

                    "surface-container": "#edefdf",
                    "secondary": "#9f3d4c",
                    "on-secondary-fixed-variant": "#802635",
                    "inverse-primary": "#bccf7f",
                    "outline": "#76786a",
                    "on-surface": "#1a1d13",
                    "inverse-surface": "#2f3227",
                    "tertiary": "#5b5c5a",
                    "on-error-container": "#93000a",
                    "inverse-on-surface": "#f0f2e1",
                    "error": "#ba1a1a",
                    "primary-fixed": "#d8eb98",
                    "on-tertiary-fixed": "#1a1c1b",
                    "surface-dim": "#d9dbcb",
                    "on-background": "#1a1d13",
                    "surface-variant": "#e2e4d3",

                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#bccf7f",
                    "surface-bright": "#f9fbea",

                    "primary-container": "#6b7b36",
                    "surface-tint": "#556421",
                    "on-primary-fixed": "#171e00",
                    "on-surface-variant": "#46483b",

                    "secondary-container": "#ff8795",

                    "secondary-fixed": "#ffdadb",

                    "on-tertiary-container": "#fdfdfa",

            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding": "20px",
                    "base": "8px",
                    "stack-md": "16px",
                    "stack-sm": "8px",
                    "stack-lg": "24px",
                    "gutter": "16px"

            "fontFamily": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center">
<div class="w-full max-w-md bg-surface-container-lowest min-h-screen flex flex-col shadow-sm">
<header class="bg-primary flex justify-between items-center w-full px-gutter h-16 shadow-sm flex-shrink-0 text-on-primary">
<button aria-label="Volver" class="p-2 active:scale-95 transition-transform hover:bg-primary-container/20 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-primary">CREAR CUENTA</h1>
<div class="p-2">
<span class="material-symbols-outlined">person</span>
</div>
</header>
<main class="flex-grow flex flex-col px-container-padding py-stack-lg gap-stack-lg">
<div class="text-center mb-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Únete a Sancarlina</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-stack-sm">Completa tus datos para comenzar a descubrir lo mejor de nuestra región.</p>
</div>
<form class="flex flex-col gap-stack-md flex-grow">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="name">Nombre y Apellido</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" id="name" placeholder="Ej: Juan Pérez" type="text"/>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Correo Electrónico</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" id="email" placeholder="tu@email.com" type="email"/>
</div>
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>
<div class="relative w-full">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 pr-12 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" id="password" placeholder="Mínimo 8 caracteres" type="password"/>
<button aria-label="Mostrar contraseña" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-outline transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-md text-label-md text-on-surface-variant" for="confirm_password">Confirmar Contraseña</label>
<div class="relative w-full">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 pr-12 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" id="confirm_password" placeholder="Repite tu contraseña" type="password"/>
<button aria-label="Mostrar contraseña" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-outline transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-start gap-3 mt-stack-sm">
<div class="flex items-center h-5">
<input class="w-5 h-5 border-outline-variant rounded text-secondary focus:ring-secondary focus:ring-2 bg-surface-container-lowest cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer" for="terms">
                        Acepto los <a class="text-secondary font-bold hover:underline" href="#">Términos, Condiciones y Políticas de Privacidad</a>
</label>
</div>
<div class="mt-auto pt-stack-lg pb-stack-md">
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md font-bold py-4 rounded-xl active:scale-95 transition-all duration-200 hover:bg-on-secondary-fixed-variant shadow-[0_4px_12px_rgba(159,61,76,0.2)]" type="submit">
                        REGISTRARME
                    </button>
</div>
</form>
<div class="text-center pb-stack-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                    ¿Ya tienes una cuenta? <a class="text-secondary font-bold hover:underline" href="#">Inicia Sesión</a>
</p>
</div>
</main>
</div>
</body></html>
