<script>
        // Simple JS for interaction demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const markers = document.querySelectorAll('.cursor-pointer');
            
            markers.forEach(marker => {
                marker.addEventListener('click', function() {
                    // Remove active state from all
                    markers.forEach(m => {
                        const pinContainer = m.querySelector('div:first-child');
                        if(pinContainer) {
                            pinContainer.classList.remove('bg-primary-container', 'scale-110');
                            pinContainer.classList.add('bg-surface');
                            const img = pinContainer.querySelector('img');
                            if(img) img.classList.replace('w-12', 'w-10');
                            if(img) img.classList.replace('h-12', 'h-10');
                        }
                        const tail = m.querySelector('.w-0');
                        if(tail) {
                             tail.classList.replace('border-l-[8px]', 'border-l-[6px]');
                             tail.classList.replace('border-r-[8px]', 'border-r-[6px]');
                             tail.classList.replace('border-t-[10px]', 'border-t-[8px]');
                        }
                        const popover = m.querySelector('.w-48');
                        if(popover) popover.remove();
                    });

                    // Add active state to clicked
                    const activePin = this.querySelector('div:first-child');
                    if(activePin) {
                        activePin.classList.remove('bg-surface');
                        activePin.classList.add('bg-primary-container', 'scale-110');
                        const img = activePin.querySelector('img');
                        if(img) img.classList.replace('w-10', 'w-12');
                        if(img) img.classList.replace('h-10', 'h-12');
                    }
                    const activeTail = this.querySelector('.w-0');
                    if(activeTail) {
                         activeTail.classList.replace('border-l-[6px]', 'border-l-[8px]');
                         activeTail.classList.replace('border-r-[6px]', 'border-r-[8px]');
                         activeTail.classList.replace('border-t-[8px]', 'border-t-[10px]');
                    }
                });
            });
        });
    </script>
