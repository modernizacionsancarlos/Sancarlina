<!-- Main Content Container -->
<main class="w-full max-w-md flex flex-col items-center text-center space-y-stack-lg">
<!-- Top Section: Icon & Headers -->
<div class="flex flex-col items-center space-y-stack-md">

<div class="w-32 h-32 rounded-full bg-surface-container flex items-center justify-center mb-4 shadow-[0_4px_12px_rgba(83,98,33,0.04)] relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-secondary to-on-secondary-fixed-variant opacity-10"></div>
<span class="material-symbols-outlined text-[64px] text-secondary" style="font-variation-settings: 'FILL' 1;">
                    rocket_launch
                </span>
</div>
<!-- Title & Badge -->
<div class="space-y-stack-sm flex flex-col items-center">
<div class="bg-primary text-on-primary px-3 py-1 rounded-full font-label-sm text-label-sm inline-block shadow-sm">

                </div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">

                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">

                </p>
</div>
</div>
<!-- Release Notes Box -->
<div class="w-full bg-surface-container rounded-[16px] p-stack-md text-left shadow-[0_4px_12px_rgba(83,98,33,0.04)]">
<h2 class="font-label-md text-label-md text-outline mb-stack-sm uppercase tracking-wider">Novedades</h2>
<ul class="space-y-stack-sm">
<li class="flex items-start space-x-gutter">
<span class="material-symbols-outlined text-primary mt-0.5" style="font-variation-settings: 'FILL' 1;">
                        stars
                    </span>
<span class="font-body-md text-body-md text-on-surface">Nueva gestión de puntos</span>
</li>
<li class="flex items-start space-x-gutter">

                        stars
                    </span>

<button class="font-label-md text-label-md text-outline hover:text-primary transition-colors py-2 px-4 rounded-full hover:bg-surface-container-low active:bg-surface-container">

<script>
        // Simple entry animation
        document.addEventListener("DOMContentLoaded", () => {
            const mainContainer = document.querySelector('main');
            mainContainer.style.opacity = '0';
            mainContainer.style.transform = 'translateY(20px)';
            mainContainer.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
            
            requestAnimationFrame(() => {
                mainContainer.style.opacity = '1';
                mainContainer.style.transform = 'translateY(0)';
            });
        });
    </script>
