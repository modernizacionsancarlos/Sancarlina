<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('#star-rating-container button');
            
            stars.forEach((starBtn, index) => {
                starBtn.addEventListener('click', () => {
                    // Simple logic to fill stars up to clicked index
                    stars.forEach((s, i) => {
                        const iconSpan = s.querySelector('span');
                        if (i <= index) {
                            iconSpan.style.fontVariationSettings = "'FILL' 1";
                            iconSpan.classList.remove('text-outline-variant');
                            iconSpan.classList.add('text-primary');
                        } else {
                            iconSpan.style.fontVariationSettings = "'FILL' 0";
                            iconSpan.classList.remove('text-primary');
                            iconSpan.classList.add('text-outline-variant');
                        }
                    });
                });
            });
        });
    </script>
