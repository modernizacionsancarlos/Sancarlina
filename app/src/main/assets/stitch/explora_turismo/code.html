<script>
        // Add subtle shadow to TopAppBar on scroll
        const topAppBar = document.getElementById('topAppBar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                topAppBar.classList.add('shadow-sm');
                topAppBar.classList.replace('bg-surface-container-low', 'bg-surface/95');
                topAppBar.classList.add('backdrop-blur-md');
            } else {
                topAppBar.classList.remove('shadow-sm');
                topAppBar.classList.replace('bg-surface/95', 'bg-surface-container-low');
                topAppBar.classList.remove('backdrop-blur-md');
            }
        });
