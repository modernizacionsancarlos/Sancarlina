<script>
        // Simple star rating interaction
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('.star-rating .material-symbols-outlined');
            const ratingText = document.getElementById('ratingText');
            const ratingMessages = [
                "Toca una estrella para calificar",
                "Malo",
                "Regular",
                "Bueno",
                "Muy Bueno",
                "Excelente"
            ];
            
            let currentRating = 0;

            stars.forEach((star, index) => {
                // Hover effect
                star.addEventListener('mouseover', () => {
                    highlightStars(index + 1);
                });

                // Mouse out effect
                star.addEventListener('mouseout', () => {
                    highlightStars(currentRating);
                });

                // Click effect
                star.addEventListener('click', () => {
                    currentRating = index + 1;
                    highlightStars(currentRating);
                    ratingText.textContent = ratingMessages[currentRating];
                    
                    // Add a small pop animation to the clicked star
                    star.classList.add('scale-125');
                    setTimeout(() => star.classList.remove('scale-125'), 150);
                });
            });

            function highlightStars(count) {
                stars.forEach((s, i) => {
                    if (i < count) {
                        s.classList.add('filled');
                        s.classList.remove('text-outline-variant');
                    } else {
                        s.classList.remove('filled');
                        s.classList.add('text-outline-variant');
                    }
                });
            }
        });
    </script>
