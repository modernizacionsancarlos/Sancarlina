<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Subtle pulse animation for indicators */
        @keyframes subtlePulse {
            0% { box-shadow: 0 0 0 0 rgba(253, 127, 138, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(253, 127, 138, 0); }
            100% { box-shadow: 0 0 0 0 rgba(253, 127, 138, 0); }
        }
        .indicator-pulse {
            animation: subtlePulse 2s infinite;
        }
        
        /* Mock background styles */
        .bg-mock-map {
            background-color: #e2e3e0;
            background-image: radial-gradient(#c4c9b4 1px, transparent 1px);
            background-size: 20px 20px;

<body class="bg-background text-on-background font-body-md h-screen w-full overflow-hidden relative selection:bg-primary-container selection:text-on-primary-container">
<!-- FAKE BACKGROUND LAYER (To simulate app UI behind the overlay) -->
<div class="absolute inset-0 z-0 bg-mock-map flex flex-col pointer-events-none opacity-40">
<!-- Fake TopAppBar -->

<button class="p-2 text-on-surface-variant">
<span class="material-symbols-outlined">menu</span>
</button>
<div class="text-headline-md font-headline-md font-bold text-primary">gondolApp</div>
<div class="w-8 h-8 rounded-full bg-surface-variant"></div>
</header>
<!-- Fake Map Content Area -->
<div class="flex-1 w-full relative">
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-primary rounded-full flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-primary">location_on</span>
</div>
</div>
<!-- Fake BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-3 pb-safe px-4 bg-surface-container rounded-t-lg shadow-sm">
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1">
<span class="material-symbols-outlined fill-icon">map</span>
<span class="text-label-lg font-label-lg mt-1">Explorar</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined">wine_bar</span>
<span class="text-label-lg font-label-lg mt-1">Bodegas</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined">favorite</span>
<span class="text-label-lg font-label-lg mt-1">Favoritos</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined">person</span>
<span class="text-label-lg font-label-lg mt-1">Perfil</span>
</div>
</nav>
</div>
<!-- COACHMARKS OVERLAY -->
<!-- Dark semi-transparent overlay to focus attention -->
<div class="absolute inset-0 z-40 bg-inverse-surface/80 backdrop-blur-sm transition-opacity duration-300 flex flex-col justify-between" id="coachmarks-overlay">
<!-- Top Section Focus (Menu) -->
<div class="relative w-full h-24 px-margin-mobile pt-8">
<!-- Indicator for Menu -->
<div class="absolute left-4 top-8 w-10 h-10 border-2 border-secondary-container rounded-full indicator-pulse z-50"></div>
<!-- Coachmark Bubble for Menu -->
<div class="absolute left-16 top-12 bg-surface-container-highest text-on-surface rounded-2xl rounded-tl-none p-4 shadow-lg max-w-[240px] z-50">
<p class="text-body-lg font-body-lg text-on-surface">Accede a tu perfil y ajustes aquí</p>
</div>
</div>
<!-- Center Section (Character) -->
<div class="flex-1 flex items-center justify-center relative pointer-events-none">
<img alt="GondolApp Guide Character" class="h-48 md:h-64 object-contain animate-[bounce_3s_ease-in-out_infinite] drop-shadow-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyJUxTCh_qeS5DuYgWuIWKDpgqA0pCczBcEs95I0ztRORK4CuKFvenMIgRc4MW7Ip6o3_CSRyxptw4m2QkOpvjLe9QT4i3RgCYOlzLOyYss2el645cPBbUJBWH-nGqNfHl0JBU1axBqoRfQHBu-YzL-90E1sZEc7fKsq8sRbKbOIwjw1tW0dIc_CFX9Azk-5mjmY9P1Wp9RdNedH3FQqJPXTv_rGR-t1H8Cc-iKk_1nC6ZCnDNju09zGvuacYn9YZO84OzsDIrD1zP">

<p class="text-body-lg font-body-lg">Explora San Carlos desde el mapa</p>
</div>
<!-- Indicator for Map Tab -->
<!-- Positioning roughly over the first tab of the fake bottom nav -->
<div class="absolute bottom-6 left-[12%] md:left-[20%] w-20 h-16 border-2 border-secondary-container rounded-full indicator-pulse z-50"></div>

<div class="mt-4 mb-safe w-full px-margin-mobile flex justify-center z-50">
<button class="bg-secondary text-on-secondary px-8 py-4 rounded-full text-title-lg font-title-lg font-medium shadow-md hover:bg-secondary/90 transition-colors w-full max-w-xs flex items-center justify-center gap-2" onclick="document.getElementById('coachmarks-overlay').style.display='none'">
