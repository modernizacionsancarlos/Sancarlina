<script>
        // Simple interaction script to handle input floating labels if values are pre-filled
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                // Initial check
                if(input.value) {
                    const label = input.parentElement.querySelector('label');
                    if(label) {
                        label.classList.add('text-[12px]', '-translate-y-1');
                    }
                }
                
                // Add blur event to keep label up if there is text
                input.addEventListener('blur', (e) => {
                    const label = e.target.parentElement.querySelector('label');
                    if(e.target.value && label) {
                        label.classList.add('text-[12px]', '-translate-y-1');
                    } else if (label) {
                        label.classList.remove('text-[12px]', '-translate-y-1');
                    }
                });
            });
        });
    </script>
