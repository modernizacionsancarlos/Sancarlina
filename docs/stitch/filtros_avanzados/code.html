<style>
        /* Custom range slider styling for webkit */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #476500; /* primary */
            cursor: pointer;
            margin-top: -8px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */

        }

<button class="p-2 rounded-full hover:bg-surface-variant/50 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">close</span>
</button>
</div>

<div class="flex-1 overflow-y-auto px-margin-tablet py-stack-lg space-y-stack-lg">
<!-- Distancia -->

</div>
<div class="pt-4 pb-2 relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/2 h-1 bg-primary rounded-l-full pointer-events-none"></div>
<input class="w-full appearance-none bg-transparent outline-none z-10 relative" max="50" min="1" oninput="document.getElementById('distance-val').innerText = this.value + ' km'" type="range" value="15">
</div>
<div class="flex justify-between text-label-lg font-label-lg text-on-surface-variant mt-2">
<span class="">1 km</span>
<span class="">50+ km</span>
</div>
