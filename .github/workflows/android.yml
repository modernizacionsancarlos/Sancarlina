name: Android CI

# Verifica cada cambio antes de que llegue a main. Los tres trabajos son
# independientes: un fallo de lint no oculta un fallo de reglas de seguridad.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tests unitarios y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # El plugin de secrets usa .env.example como respaldo, pero dejar el .env
      # explícito evita que un cambio en esa configuración rompa el pipeline.
      - name: Preparar .env de compilación
        run: cp .env.example .env

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Tests unitarios
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-build
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

  instrumented:
    name: Tests instrumentados
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # El emulador es lento y frágil; se ejecuta solo al integrar a main y a
    # pedido, no en cada push de una rama de trabajo.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar .env de compilación
        run: cp .env.example .env

      - name: Habilitar aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar tests en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-instrumentados
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore

  firestore-rules:
    name: Reglas de seguridad Firestore y Storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # El emulador de Firebase requiere JDK 21 o superior.
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Ejecutar tests de reglas
        run: npm run test:rules
